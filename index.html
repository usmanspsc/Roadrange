<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="RoadRange: smart, reliable and seamless transportation solutions.">
<title>RoadRange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>html{color-scheme:dark}</style>
</head>
<body>
<style>
/* Layout concept: dark cinematic navy bands (nav, hero, fleet, CTA, footer) alternate with
   white and cloud-grey content bands. One orange accent, used for actions and the road line. */
:root{
  --navy:#070d1f; --navy-2:#0d1730; --navy-3:#16224a;
  --orange:#ff5a1f; --orange-hi:#ff7a45; --orange-ink:#1a0a02;
  --white:#ffffff; --cloud:#f2f4f8; --mist:#c5cde0; --slate:#55617f; --ink:#0b1330;
  --line-d:rgba(255,255,255,.12); --line-l:#dde2ee;
  --f-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
  --gutter-l:max(16px,env(safe-area-inset-left,0px));
  --gutter-r:max(16px,env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--navy);color:var(--white);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
img,svg{max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
:focus-visible{outline:3px solid var(--orange-hi);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.band{padding-block:clamp(64px,9vw,120px)}
.dark{background:var(--navy);color:var(--white)}
.dark-2{background:var(--navy-2);color:var(--white)}
.light{background:var(--white);color:var(--ink)}
.cloud{background:var(--cloud);color:var(--ink)}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:28px;height:2px;background:currentColor}
.light .eyebrow,.cloud .eyebrow{color:#c23d0a}
.h2{font-size:clamp(1.7rem,4.2vw,3rem)}
.lead{font-size:clamp(1.02rem,1.5vw,1.2rem);color:var(--mist);max-width:56ch}
.light .lead,.cloud .lead{color:var(--slate)}
.sec-head{display:flex;flex-direction:column;gap:16px;margin-bottom:clamp(36px,5vw,64px);max-width:720px}
.sec-head.split{max-width:none;flex-direction:row;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:24px}
.sec-head.split>div{display:flex;flex-direction:column;gap:16px;max-width:680px;min-width:0}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:.98rem;border:2px solid transparent;transition:transform .25s var(--ease),background .25s,box-shadow .25s,border-color .25s,color .25s;white-space:nowrap;min-height:48px}
.btn svg{width:18px;height:18px;transition:transform .25s var(--ease)}
.btn:hover svg{transform:translateX(4px)}
.btn-primary{background:var(--orange);color:var(--orange-ink)}
.btn-primary:hover{background:var(--orange-hi);box-shadow:0 10px 30px -8px rgba(255,90,31,.7);transform:translateY(-2px)}
.btn-ghost{border-color:rgba(255,255,255,.35);color:var(--white);background:rgba(255,255,255,.04);backdrop-filter:blur(6px)}
.btn-ghost:hover{border-color:var(--white);background:rgba(255,255,255,.12);transform:translateY(-2px)}
.btn-dark{background:var(--navy);color:var(--white)}
.btn-dark:hover{background:var(--navy-3);transform:translateY(-2px)}
.link-arrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--orange);font-size:.95rem}
.light .link-arrow,.cloud .link-arrow{color:#c23d0a}
.link-arrow svg{width:16px;height:16px;transition:transform .25s var(--ease)}
.link-arrow:hover svg{transform:translateX(5px)}
/* preloader */
.loader{position:fixed;inset:0;z-index:100;background:var(--navy);display:grid;place-items:center;animation:loaderOut .5s .75s forwards;pointer-events:none}
.loader-in{display:flex;flex-direction:column;align-items:center;gap:22px}
.loader-bar{width:140px;height:3px;background:var(--line-d);border-radius:3px;overflow:hidden}
.loader-bar::after{content:"";display:block;height:100%;width:40%;background:var(--orange);animation:slide .7s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
@keyframes loaderOut{to{opacity:0;visibility:hidden}}
/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(7,13,31,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-d)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:72px;gap:16px}
.logo{display:inline-flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.03em}
.logo svg{width:38px;height:38px;flex:none}
.logo b{font-weight:500;color:var(--orange)}
.nav-links{display:none;gap:6px;align-items:center}
.nav-links a{padding:10px 16px;border-radius:999px;font-weight:600;font-size:.95rem;color:var(--mist);transition:color .2s,background .2s}
.nav-links a:hover{color:var(--white);background:rgba(255,255,255,.08)}
.nav-links a[aria-current="page"]{color:var(--white);background:rgba(255,255,255,.1)}
.nav-cta{display:none}
.burger{width:48px;height:48px;border-radius:14px;border:1px solid var(--line-d);background:rgba(255,255,255,.05);color:var(--white);display:grid;place-items:center}
.burger svg{width:22px;height:22px}
.drawer{position:fixed;inset:0;z-index:55;background:var(--navy);padding:calc(env(safe-area-inset-top,0px) + 16px) var(--gutter-r) 32px var(--gutter-l);display:flex;flex-direction:column;gap:8px;transform:translateY(-100%);visibility:hidden;transition:transform .5s var(--ease),visibility 0s .5s}
.drawer.open{transform:none;visibility:visible;transition:transform .5s var(--ease)}
.drawer-top{display:flex;justify-content:space-between;align-items:center;height:56px;margin-bottom:24px}
.drawer a.dl{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,7vw,2.2rem);padding:14px 0;border-bottom:1px solid var(--line-d);display:flex;justify-content:space-between;align-items:center}
.drawer a.dl svg{color:var(--orange);width:24px;height:24px}
.drawer .btn{margin-top:28px;width:100%}
@media(min-width:960px){.nav-links{display:flex}.nav-cta{display:inline-flex}.burger{display:none}}
/* hero */
.hero{position:relative;overflow:hidden;background:var(--navy);min-height:clamp(620px,88vh,860px);display:flex;align-items:flex-end}
.hero-art{position:absolute;inset:0}
.hero-art svg{width:100%;height:100%;display:block}
.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,13,31,.92) 0%,rgba(7,13,31,.55) 52%,rgba(7,13,31,.1) 100%),linear-gradient(0deg,var(--navy) 0%,transparent 40%)}
.hero-in{position:relative;z-index:2;padding-block:clamp(56px,10vw,120px) clamp(48px,7vw,88px);display:flex;flex-direction:column;gap:28px;width:100%}
.hero h1{font-size:clamp(2.3rem,7.2vw,5.4rem);font-weight:800;max-width:11ch}
.hero h1 em{font-style:normal;color:var(--orange)}
.hero .lead{color:#dbe2f2;font-size:clamp(1.05rem,1.8vw,1.3rem)}
.hero-ctas{display:flex;flex-wrap:wrap;gap:14px}
.hero-chip{position:absolute;z-index:2;right:var(--gutter-r);bottom:clamp(28px,5vw,56px);display:none;gap:14px;align-items:center;padding:14px 20px;border-radius:18px;background:rgba(13,23,48,.7);border:1px solid var(--line-d);backdrop-filter:blur(12px);font-size:.85rem}
.hero-chip .dot{width:10px;height:10px;border-radius:50%;background:#3ddc97;box-shadow:0 0 0 5px rgba(61,220,151,.2)}
.hero-chip span{font-family:var(--f-mono);color:var(--mist);display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
@media(min-width:900px){.hero-chip{display:flex}}
.road-lines line{stroke-dasharray:26 34;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-60}}
.tail{animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{opacity:.7}}
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-l);border:1px solid var(--line-l);border-radius:24px;overflow:hidden}
.stat{background:var(--white);padding:clamp(22px,3.5vw,40px);display:flex;flex-direction:column;gap:8px;min-width:0;transition:background .3s}
.stat:hover{background:var(--cloud)}
.stat-n{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,5vw,3.6rem);letter-spacing:-.04em;line-height:1;color:var(--ink)}
.stat-n i{font-style:normal;color:var(--orange)}
.stat-l{color:var(--slate);font-weight:600}
.note{font-family:var(--f-mono);font-size:.74rem;color:var(--slate);margin-top:16px}
@media(min-width:800px){.stats{grid-template-columns:repeat(4,1fr)}}
/* cards */
.grid{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:640px){.grid.g2,.grid.g3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1020px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.svc{position:relative;display:flex;flex-direction:column;background:var(--white);border:1px solid var(--line-l);border-radius:24px;overflow:hidden;transition:transform .4s var(--ease),box-shadow .4s,border-color .4s;min-width:0}
.svc:hover{transform:translateY(-8px);box-shadow:0 30px 60px -28px rgba(11,19,48,.35);border-color:#c8cfe0}
.svc-img{aspect-ratio:16/10;overflow:hidden;background:var(--navy)}
.svc-img svg{width:100%;height:100%;display:block;transition:transform .8s var(--ease)}
.svc:hover .svc-img svg{transform:scale(1.07)}
.svc-body{padding:26px;display:flex;flex-direction:column;gap:12px;flex:1}
.svc-body{position:relative;padding-top:34px}
.svc-ico{position:absolute;top:-26px;right:22px;width:52px;height:52px;border-radius:16px;background:var(--orange);color:var(--orange-ink);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(255,90,31,.7)}
.svc-ico svg{width:24px;height:24px}
.svc h3{font-size:1.18rem}
.svc p{color:var(--slate);font-size:.97rem}
.svc .link-arrow{margin-top:auto;padding-top:6px}
/* why */
.why{display:grid;gap:clamp(32px,5vw,72px);grid-template-columns:1fr;align-items:start}
@media(min-width:960px){.why{grid-template-columns:5fr 6fr}}
.why-art{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;background:var(--navy);max-height:640px}
.why-art svg{width:100%;height:100%;display:block}
.why-badge{position:absolute;left:18px;bottom:18px;right:18px;display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:18px;background:rgba(7,13,31,.78);backdrop-filter:blur(10px);border:1px solid var(--line-d);color:var(--white);font-size:.9rem}
.why-badge svg{width:30px;height:30px;color:var(--orange);flex:none}
.why-list{display:grid;gap:0;grid-template-columns:1fr}
.why-item{display:grid;grid-template-columns:48px 1fr;gap:18px;padding:24px 0;border-top:1px solid var(--line-l);transition:padding .3s var(--ease)}
.why-item:last-child{border-bottom:1px solid var(--line-l)}
.why-item:hover{padding-left:10px}
.why-item .ic{width:48px;height:48px;border-radius:14px;background:var(--navy);color:var(--orange);display:grid;place-items:center}
.why-item .ic svg{width:22px;height:22px}
.why-item h3{font-size:1.05rem;margin-bottom:6px}
.why-item p{color:var(--slate);font-size:.96rem}
/* fleet */
.fleet-row{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:640px){.fleet-row{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.fleet-row{grid-template-columns:repeat(6,1fr)}.fleet-row .fc:nth-child(-n+2){grid-column:span 3}.fleet-row .fc:nth-child(n+3){grid-column:span 2}}
.fc{position:relative;border-radius:24px;overflow:hidden;background:var(--navy-2);border:1px solid var(--line-d);min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .4s var(--ease),border-color .4s}
.fc:hover{transform:translateY(-6px);border-color:rgba(255,122,69,.6)}
.fc-art{position:absolute;inset:0}
.fc-art svg{width:100%;height:100%;display:block;transition:transform .8s var(--ease)}
.fc:hover .fc-art svg{transform:scale(1.06) translateX(-2%)}
.fc-body{position:relative;padding:22px;background:linear-gradient(0deg,rgba(7,13,31,.95) 30%,transparent);display:flex;flex-direction:column;gap:6px}
.fc-body h3{font-size:1.15rem}
.fc-body p{color:var(--mist);font-size:.92rem}
.fc-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tag{font-family:var(--f-mono);font-size:.72rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line-d);color:var(--mist);display:inline-flex;gap:6px;align-items:center}
.tag svg{width:13px;height:13px}
/* how */
.steps{display:grid;gap:22px;grid-template-columns:1fr;position:relative}
@media(min-width:860px){.steps{grid-template-columns:repeat(3,1fr)}.steps::before{content:"";position:absolute;top:34px;left:12%;right:12%;height:2px;background:repeating-linear-gradient(90deg,var(--orange) 0 14px,transparent 14px 28px);opacity:.7}}
.step{position:relative;display:flex;flex-direction:column;gap:14px;padding:6px 0;min-width:0}
.step-n{width:68px;height:68px;border-radius:50%;background:var(--navy);color:var(--orange);border:2px solid var(--orange);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem;position:relative;z-index:1}
.step h3{font-size:1.2rem}
.step p{color:var(--slate)}
/* testimonials */
.t-wrap{position:relative}
.t-track{display:flex;transition:transform .7s var(--ease)}
.t-slide{flex:0 0 100%;min-width:0;padding-right:2px}
.t-card{display:grid;gap:28px;padding:clamp(26px,4vw,52px);border-radius:28px;background:var(--navy-2);border:1px solid var(--line-d);min-height:300px;align-content:space-between}
.t-card q{quotes:none;font-family:var(--f-display);font-weight:500;font-size:clamp(1.1rem,2.4vw,1.7rem);line-height:1.35;letter-spacing:-.01em}
.t-who{display:flex;align-items:center;gap:14px}
.t-av{width:48px;height:48px;border-radius:50%;background:var(--navy-3);display:grid;place-items:center;color:var(--orange);font-family:var(--f-display);font-weight:700}
.t-who small{display:block;color:var(--mist)}
.t-demo{align-self:start;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:999px;background:rgba(255,90,31,.14);color:var(--orange-hi);width:max-content}
.t-ctrl{display:flex;align-items:center;gap:14px;margin-top:22px}
.t-btn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line-d);background:transparent;color:var(--white);display:grid;place-items:center;transition:background .2s,border-color .2s}
.t-btn:hover{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.t-btn svg{width:20px;height:20px}
.dots{display:flex;gap:8px;margin-left:auto}
.dots button{width:10px;height:10px;border-radius:999px;border:0;background:var(--line-d);padding:0;transition:width .3s,background .3s}
.dots button[aria-current="true"]{width:30px;background:var(--orange)}
/* cta + footer */
.cta{position:relative;overflow:hidden;border-radius:32px;padding:clamp(36px,7vw,88px);background:var(--navy-3);display:grid;gap:26px;justify-items:start}
.cta-art{position:absolute;inset:0;opacity:.9}
.cta-art svg{width:100%;height:100%;display:block}
.cta>*:not(.cta-art){position:relative;z-index:1}
.cta h2{font-size:clamp(1.9rem,5.4vw,3.8rem);max-width:14ch}
.cta p{color:#dbe2f2;font-size:1.1rem;max-width:44ch}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,23,48,.92),rgba(13,23,48,.3))}
.cta>*:not(.cta-art){z-index:2}
.foot{background:var(--navy);border-top:1px solid var(--line-d);padding-block:64px 32px}
.foot-grid{display:grid;gap:40px;grid-template-columns:1fr}
@media(min-width:760px){.foot-grid{grid-template-columns:1.6fr 1fr 1fr 1.3fr}}
.foot h4{font-size:.8rem;font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:18px;font-weight:500}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.foot li a{color:var(--mist);transition:color .2s}
.foot li a:hover{color:var(--white)}
.foot p.sm{color:var(--mist);max-width:38ch;margin-top:18px}
.contact-li{display:flex;gap:12px;color:var(--mist);align-items:flex-start;min-width:0;overflow-wrap:anywhere}
.contact-li svg{width:18px;height:18px;color:var(--orange);flex:none;margin-top:4px}
.social{display:flex;gap:10px;margin-top:22px}
.social a{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-d);display:grid;place-items:center;transition:background .2s,border-color .2s,color .2s}
.social a:hover{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.social svg{width:18px;height:18px}
.foot-bot{margin-top:48px;padding-top:24px;border-top:1px solid var(--line-d);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;color:var(--mist);font-size:.88rem}
/* inner pages */
.phero{position:relative;overflow:hidden;background:var(--navy);padding-block:clamp(64px,10vw,130px) clamp(48px,7vw,90px)}
.phero-art{position:absolute;inset:0;opacity:.55}
.phero-art svg{width:100%;height:100%;display:block}
.phero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--navy) 20%,rgba(7,13,31,.4))}
.phero .wrap{position:relative;z-index:2;display:flex;flex-direction:column;gap:20px}
.phero h1{font-size:clamp(2rem,6vw,4.2rem);max-width:16ch}
.crumbs{font-family:var(--f-mono);font-size:.78rem;color:var(--mist);display:flex;gap:8px;align-items:center}
.crumbs a:hover{color:var(--orange)}
.split2{display:grid;gap:clamp(28px,5vw,64px);grid-template-columns:1fr;align-items:center}
@media(min-width:900px){.split2{grid-template-columns:1fr 1fr}.split2.rev>:first-child{order:2}}
.split2 .art{border-radius:28px;overflow:hidden;aspect-ratio:5/4;background:var(--navy)}
.split2 .art svg{width:100%;height:100%;display:block}
.split2 .txt{display:flex;flex-direction:column;gap:18px;min-width:0}
.split2 .txt p{color:var(--slate)}
.vals{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:700px){.vals{grid-template-columns:repeat(3,1fr)}}
.val{padding:28px;border-radius:22px;background:var(--white);border:1px solid var(--line-l);display:flex;flex-direction:column;gap:12px}
.val svg{width:28px;height:28px;color:#c23d0a}
.val p{color:var(--slate)}
.val h3{font-size:1.1rem}
.tl{display:grid;gap:0;border-left:2px solid var(--line-d);margin-left:8px}
.tl-i{padding:0 0 30px 28px;position:relative}
.tl-i::before{content:"";position:absolute;left:-8px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--orange)}
.tl-i b{font-family:var(--f-mono);font-weight:500;color:var(--orange-hi);font-size:.85rem}
.tl-i h3{font-size:1.1rem;margin:4px 0 6px}
.tl-i p{color:var(--mist)}
.svc-detail{display:grid;gap:clamp(24px,4vw,56px);grid-template-columns:1fr;padding-block:clamp(36px,5vw,64px);border-top:1px solid var(--line-l);align-items:center}
.svc-detail:first-of-type{border-top:0}
@media(min-width:900px){.svc-detail{grid-template-columns:1fr 1fr}.svc-detail.rev>:first-child{order:2}}
.svc-detail .art{border-radius:24px;overflow:hidden;aspect-ratio:16/10;background:var(--navy)}

/* ===== animated hero: live perspective highway on canvas ===== */
function heroMarkup(){
  const W=(t,i,c='')=>`<span class="hw1"><span class="${c}" style="--i:${i}">${t}</span></span>`;
  return `<section class="hero" id="hero"><canvas id="hc" aria-hidden="true"></canvas><div class="hero-shade"></div>
<div class="wrap hero-in"><span class="eyebrow fx-in" style="--d:.3s">Modern transportation technology</span>
<h1 aria-label="Your Journey. Our Commitment.">${W('Your',0)}${W('Journey.',1)}<br>${W('Our',2,'grad')}${W('Commitment.',3,'grad')}<svg class="swoosh" viewBox="0 0 420 20" aria-hidden="true"><path d="M4 14 C90 2 210 2 416 10"/></svg></h1>
<p class="lead fx-in" style="max-width:46ch;--d:1.9s">Smart, reliable and seamless transportation solutions designed around your journey.</p>
<div class="hero-ctas fx-in" style="--d:2.1s">${btn('services','Explore Our Services','btn-primary')}${btn('quote','Get a Quote','btn-ghost','')}</div>
<div class="hero-meta fx-in" style="--d:2.4s"><span>${ic('mouse-pointer-click')}Press and hold the road to accelerate</span></div></div>
<div class="float-chip fc1 fx-in" style="--d:2.6s">${ic('map-pinned')}<div><small>Route</small>Planned for your trip</div></div>
<div class="float-chip fc2 fx-in" style="--d:2.9s">${ic('badge-check')}<div><small>Driver</small>Assigned and confirmed</div></div>
<div class="scroll-cue" aria-hidden="true"></div></section>`;
}
function marquee(){
  const row=SERVICES.map(s=>`<span>${s.t}</span>`).join('');
  return `<div class="marquee" aria-hidden="true"><div class="mq-track">${row}${row}</div></div>`;
}
function startHero(){
  const hero=document.getElementById('hero'),cv=document.getElementById('hc');
  if(!cv)return()=>{};
  const ctx=cv.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let w,h,dpr,vx,vy,R,carW,carT,raf=0,run=true,vis=true,last=0,time=0,dist=0,boost=1,target=1,meteor=null,nextMeteor=3;
  const m={x:0,y:0,tx:0,ty:0},rnd=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;
  const stars=Array.from({length:150},()=>({x:Math.random(),y:Math.random()*.55,r:rnd(.3,1.5),p:rnd(0,TAU),s:rnd(.6,2.6)}));
  const ridge=(sd,a,b)=>Array.from({length:61},(_,i)=>{const x=i/60;return b+Math.sin(x*7+sd)*a+Math.sin(x*17+sd*2)*a*.45+Math.sin(x*33+sd*3)*a*.16});
  const far=ridge(1,.05,.09),near=ridge(4.2,.06,.05);
  const streaks=Array.from({length:80},()=>({a:rnd(0,TAU),r:Math.random(),v:rnd(.25,.9)}));
  const traffic=[[-.667,16,5],[.667,26,9],[-.667,38,3],[.667,46,11],[.667,12,2]].map(a=>({lat:a[0],z:a[1],v:a[2],hue:Math.random()}));
  const body=new Path2D('M-176 110 Q-182 50 -146 30 L-104 -26 Q-82 -58 -42 -60 L42 -60 Q82 -58 104 -26 L146 30 Q182 50 176 110 Z');
  const glass=new Path2D('M-94 -20 L-70 -50 L70 -50 L94 -20 Z');
  function size(){
    const r=cv.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);
    cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);w=r.width;h=r.height;
    const mob=w<760;vx=w*(mob?.5:.7);vy=h*(mob?.4:.45);R=w*.95;carW=mob?w*.56:Math.min(w*.22,360);carT=mob?.5:.6;
  }
  const yAt=t=>vy+(h-vy)*t;
  function quad(lat,half,z1,z2,fill){
    z1=Math.max(z1,.5);if(z2<=z1)return;const t1=1/z1,t2=1/z2,y1=yAt(t1),y2=yAt(t2);
    ctx.fillStyle=fill;ctx.beginPath();
    ctx.moveTo(vx+(lat-half)*R*t1,y1);ctx.lineTo(vx+(lat+half)*R*t1,y1);ctx.lineTo(vx+(lat+half)*R*t2,y2);ctx.lineTo(vx+(lat-half)*R*t2,y2);ctx.fill();
  }
  function glow(x,y,r,col,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
  function ridgePath(p,off,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-40+off,vy+2);p.forEach((v,i)=>ctx.lineTo(-40+off+(w+80)*i/60,vy-v*h));ctx.lineTo(w+40+off,vy+2);ctx.fill()}
  function draw(){
    const px=m.x,py=m.y;
    const sk=ctx.createLinearGradient(0,0,0,vy+30);sk.addColorStop(0,'#03071a');sk.addColorStop(.55,'#12205a');sk.addColorStop(.9,'#7a3a6a');sk.addColorStop(1,'#ff6a2c');
    ctx.fillStyle=sk;ctx.fillRect(0,0,w,h);
    stars.forEach(s=>{const a=.35+.65*Math.abs(Math.sin(time*s.s+s.p));ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.beginPath();ctx.arc(s.x*w-px*10*s.r,s.y*h*.9-py*6,s.r,0,TAU);ctx.fill()});
    if(meteor){const k=meteor.k;ctx.strokeStyle=`rgba(255,220,180,${1-k})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(meteor.x+k*300,meteor.y+k*140);ctx.lineTo(meteor.x+k*300-90,meteor.y+k*140-42);ctx.stroke()}
    ctx.globalCompositeOperation='lighter';glow(vx-px*20,vy-8,520+Math.sin(time*.8)*30,'255,122,60',.6);ctx.globalCompositeOperation='source-over';
    ridgePath(far,-px*14,'#0d1740');ridgePath(near,-px*30,'#080e2a');
    ctx.fillStyle='#050816';ctx.fillRect(0,vy,w,h-vy);
    const rg=ctx.createLinearGradient(0,vy,0,h);rg.addColorStop(0,'#3a3f86');rg.addColorStop(.25,'#1a2154');rg.addColorStop(1,'#070b1c');
    ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(vx,vy);ctx.lineTo(vx+R,h);ctx.lineTo(vx-R,h);ctx.fill();
    const D=dist;
    [-1,1].forEach(s=>quad(s*.985,.018,.5,60,'rgba(255,122,69,.85)'));
    for(let i=0;i<14;i++){const z=((i*6-D)%84+84)%84+.6;[-.333,.333].forEach(l=>quad(l,.011,z,z+3,'rgba(235,240,255,.9)'))}
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<10;i++){const z=((i*7-D)%70+70)%70+.6,t=1/z,y=yAt(t),ph=Math.min(1,z/6);[-1,1].forEach(s=>{const x=vx+s*1.22*R*t,hh=R*t*.5;ctx.strokeStyle=`rgba(180,190,230,${.5*ph})`;ctx.lineWidth=Math.max(1,3*t);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-hh);ctx.lineTo(x-s*hh*.22,y-hh-hh*.03);ctx.stroke();glow(x-s*hh*.24,y-hh,Math.max(10,170*t),'255,190,120',.75*ph)})}
    traffic.forEach(c=>{const t=1/c.z,x=vx+c.lat*R*t,y=yAt(t),s=R*t*.2;if(c.z<5)return;const gr=Math.min(46,Math.max(8,s*2));glow(x-s*.6,y-s*.45,gr,'255,50,40',.95);glow(x+s*.6,y-s*.45,gr,'255,50,40',.95)});
    const fog=ctx.createLinearGradient(0,vy-50,0,vy+150);fog.addColorStop(0,'rgba(255,106,44,0)');fog.addColorStop(.3,'rgba(255,130,70,.55)');fog.addColorStop(1,'rgba(255,106,44,0)');ctx.fillStyle=fog;ctx.fillRect(0,vy-50,w,200);
    streaks.forEach(s=>{const r0=s.r*s.r,r1=Math.min(1,r0+.05*boost*s.v+.01),d=Math.max(w,h);ctx.strokeStyle=`rgba(255,${160+s.v*80|0},120,${.04+r0*.45})`;ctx.lineWidth=1+r0*2;ctx.beginPath();ctx.moveTo(vx+Math.cos(s.a)*r0*d,vy+Math.sin(s.a)*r0*d*.8);ctx.lineTo(vx+Math.cos(s.a)*r1*d,vy+Math.sin(s.a)*r1*d*.8);ctx.stroke()});
    ctx.globalCompositeOperation='source-over';
    const sc=carW/352,cx=vx+Math.sin(time*.7)*10+px*26,cy=yAt(carT)+Math.sin(time*9)*1.1*boost+py*8;
    ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(0,-140);
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.beginPath();ctx.ellipse(0,148,220,20,0,0,TAU);ctx.fill();
    ctx.globalCompositeOperation='lighter';glow(0,170,300,'255,40,30',.28+.08*Math.sin(time*3));ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#04070f';[-128,128].forEach(x=>{ctx.beginPath();ctx.ellipse(x,118,34,26,0,0,TAU);ctx.fill()});
    const bg=ctx.createLinearGradient(0,-60,0,110);bg.addColorStop(0,'#2a3a78');bg.addColorStop(.5,'#141f48');bg.addColorStop(1,'#080d22');
    ctx.fillStyle=bg;ctx.fill(body);ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=2;ctx.stroke(body);
    ctx.fillStyle='#03061a';ctx.fill(glass);ctx.strokeStyle='rgba(255,140,90,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-90,-22);ctx.lineTo(-66,-48);ctx.stroke();
    const pl=.85+.15*Math.sin(time*3);ctx.fillStyle=`rgba(255,45,31,${pl})`;[[-166,-90],[90,166]].forEach(a=>{ctx.beginPath();ctx.roundRect(a[0],34,a[1]-a[0],14,7);ctx.fill()});ctx.fillRect(-90,39,180,4);
    ctx.fillStyle='rgba(225,232,250,.92)';ctx.beginPath();ctx.roundRect(-34,70,68,22,4);ctx.fill();
    ctx.globalCompositeOperation='lighter';glow(-128,41,110,'255,50,35',.5*pl);glow(128,41,110,'255,50,35',.5*pl);glow(0,41,160,'255,60,40',.16);
    ctx.restore();ctx.globalCompositeOperation='source-over';
  }
  function step(dt){
    time+=dt;m.x+=(m.tx-m.x)*.06;m.y+=(m.ty-m.y)*.06;boost+=(target-boost)*.05;
    dist+=14*boost*dt;
    streaks.forEach(s=>{s.r+=dt*.22*boost*s.v;if(s.r>1){s.r=0;s.a=rnd(0,TAU)}});
    traffic.forEach(c=>{c.z-=(14-c.v)*boost*dt;if(c.z<4.5){c.z=rnd(42,60);c.lat=Math.random()<.5?-.667:.667}});
    nextMeteor-=dt;if(nextMeteor<0&&!meteor){meteor={x:rnd(.1,.6)*w,y:rnd(.02,.2)*h,k:0};nextMeteor=rnd(4,8)}
    if(meteor){meteor.k+=dt*1.4;if(meteor.k>1)meteor=null}
  }
  function frame(ts){raf=requestAnimationFrame(frame);if(!run||!vis)return;const dt=Math.min((ts-last)/1000||0,.05);last=ts;step(dt);draw()}
  size();
  if(reduce){time=2;draw()}else raf=requestAnimationFrame(frame);
  const onMove=e=>{m.tx=e.clientX/innerWidth-.5;m.ty=e.clientY/innerHeight-.5};
  const down=e=>{if(e.target.closest('a,button'))return;target=2.8};const up=()=>{target=1};
  hero.addEventListener('pointermove',onMove);hero.addEventListener('pointerdown',down);addEventListener('pointerup',up);hero.addEventListener('pointerleave',up);
  const ro=new ResizeObserver(()=>{size();if(reduce)draw()});ro.observe(hero);
  const io=new IntersectionObserver(es=>{vis=es[0].isIntersecting});io.observe(hero);
  const vc=()=>{run=!document.hidden};document.addEventListener('visibilitychange',vc);
  return()=>{cancelAnimationFrame(raf);ro.disconnect();io.disconnect();removeEventListener('pointerup',up);document.removeEventListener('visibilitychange',vc)};
}
/* ===== interaction effects ===== */
const FX={fine:matchMedia('(pointer:fine)').matches,reduce:matchMedia('(prefers-reduced-motion:reduce)').matches,cleanup:[]};
function fxGlobal(){
  const prog=document.createElement('div');prog.id='prog';document.body.appendChild(prog);
  const nav=document.querySelector('.nav');
  const onScroll=()=>{const max=document.documentElement.scrollHeight-innerHeight;prog.style.transform=`scaleX(${max>0?scrollY/max:0})`;nav.classList.toggle('scrolled',scrollY>30);parallax()};
  addEventListener('scroll',onScroll,{passive:true});onScroll();
}
function parallax(){
  document.querySelectorAll('[data-par]').forEach(el=>{const r=el.parentElement.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;const k=(r.top+r.height/2-innerHeight/2)/innerHeight;el.style.transform=`translateY(${(k*-48).toFixed(1)}px) scale(1.14)`});
}
function fxPage(){
  const q=s=>[...document.querySelectorAll(s)];
  /* roll text on buttons and links */
  q('.btn,.nav-links a,.foot li a,.link-arrow,.chip').forEach(el=>{
    [...el.childNodes].forEach(n=>{if(n.nodeType===3&&n.textContent.trim()){const t=n.textContent.trim(),s=document.createElement('span');s.className='roll';s.dataset.t=t;s.innerHTML='<span></span>';s.firstChild.textContent=t;n.replaceWith(s)}});
  });
  /* split headings */
  q('.h2,.cta h2,.phero h1').forEach(h=>{
    if(h.querySelector('*'))return;const words=h.textContent.trim().split(/\s+/);
    h.setAttribute('aria-label',h.textContent.trim());
    h.innerHTML=words.map((wd,i)=>`<span class="hw" aria-hidden="true"><span style="--i:${i}">${wd}</span></span>`).join(' ');h.classList.add('split');
  });
  const seen=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');seen.unobserve(e.target)}}),{threshold:.2});
  q('.split').forEach(h=>seen.observe(h));setTimeout(()=>q('.split').forEach(h=>h.classList.add('in')),4000);
  /* count-up */
  q('.stat-n').forEach(el=>{
    const num=el.firstChild,end=parseInt(num.textContent,10);if(FX.reduce||isNaN(end))return;
    const io=new IntersectionObserver(es=>{if(!es[0].isIntersecting)return;io.disconnect();const t0=performance.now();(function tick(now){const k=Math.min(1,(now-t0)/1600),e=1-Math.pow(1-k,4);num.textContent=Math.round(end*e);if(k<1)requestAnimationFrame(tick)})(t0)},{threshold:.6});io.observe(el);
  });
  if(!FX.fine||FX.reduce)return;
  /* 3D tilt + glare */
  q('[data-tilt]').forEach(el=>{
    el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;el.style.transitionDelay='0s';el.style.transition='transform .12s linear';el.style.setProperty('--mx',px*100+'%');el.style.setProperty('--my',py*100+'%');el.style.transform=`perspective(1000px) rotateX(${((.5-py)*8).toFixed(2)}deg) rotateY(${((px-.5)*10).toFixed(2)}deg) translateY(-8px)`});
    el.addEventListener('pointerleave',()=>{el.style.transition='transform .7s cubic-bezier(.2,.7,.2,1)';el.style.transform=''});
  });
  /* magnetic buttons */
  q('.btn,.social a,.t-btn,.burger').forEach(el=>{
    el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();el.style.translate=`${((e.clientX-r.left-r.width/2)*.28).toFixed(1)}px ${((e.clientY-r.top-r.height/2)*.4).toFixed(1)}px`});
    el.addEventListener('pointerleave',()=>{el.style.translate=''});
  });
}
/* ===== shell, router, interactions ===== */
const app=document.getElementById('app');
function shell(){
  app.innerHTML=`<div class="loader" aria-hidden="true"><div class="loader-in">${logo()}<div class="loader-bar"></div></div></div>
<header class="nav"><div class="wrap nav-in"><a href="#home" aria-label="RoadRange home">${logo()}</a><nav class="nav-links" aria-label="Main">${NAV.map(n=>link(n[0],n[1])).join('')}</nav><a href="#quote" class="btn btn-primary nav-cta" data-route="quote">Get a Quote${ic('arrow-right')}</a><button class="burger" id="bg" aria-label="Open menu" aria-expanded="false" aria-controls="dr">${ic('menu')}</button></div></header>
<div class="drawer" id="dr" aria-hidden="true"><div class="drawer-top">${logo()}<button class="burger" id="bx" aria-label="Close menu">${ic('x')}</button></div>${NAV.map(n=>`<a class="dl" href="#${n[0]}" data-route="${n[0]}">${n[1]}${ic('arrow-up-right')}</a>`).join('')}<a class="btn btn-primary" href="#quote">Get a Quote${ic('arrow-right')}</a></div>
<main id="view" tabindex="-1"></main><div id="foot"></div>`;
  const dr=document.getElementById('dr'),bg=document.getElementById('bg');
  const set=o=>{dr.classList.toggle('open',o);dr.setAttribute('aria-hidden',!o);bg.setAttribute('aria-expanded',o);document.body.style.overflow=o?'hidden':''};
  bg.onclick=()=>set(true);document.getElementById('bx').onclick=()=>set(false);
  dr.addEventListener('click',e=>{if(e.target.closest('a'))set(false)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')set(false)});
}
let stopHero=()=>{};
function route(){
  stopHero();
  const r=(location.hash||'#home').slice(1);const key=PAGES[r]?r:'home';
  const view=document.getElementById('view');
  view.innerHTML=`<div class="page">${PAGES[key]()}</div>`;
  document.getElementById('foot').innerHTML=footer();
  document.querySelectorAll('.nav-links a').forEach(a=>a.getAttribute('data-route')===key?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  const names={home:'RoadRange',about:'About Us | RoadRange',services:'Services | RoadRange',fleet:'Our Fleet | RoadRange',contact:'Contact | RoadRange',quote:'Get a Quote | RoadRange'};
  document.title=names[key];
  window.scrollTo({top:0,behavior:'instant'});
  if(window.lucide)lucide.createIcons();
  reveal();wire(key);fxPage();if(key==='home')stopHero=startHero();parallax();
}
function reveal(){
  const els=[...document.querySelectorAll('.rv')];
  if(!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion:reduce)').matches){els.forEach(e=>e.classList.add('in'));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px',threshold:.08});
  els.forEach((e,i)=>{e.style.transitionDelay=(i%3)*70+'ms';io.observe(e)});
}
function wire(key){
  if(key==='home'){
    const tt=document.getElementById('tt');let i=0,timer;
    const dots=[...document.querySelectorAll('#td button')];
    const go=n=>{i=(n+TESTI.length)%TESTI.length;tt.style.transform=`translateX(${-i*100}%)`;dots.forEach((d,k)=>d.setAttribute('aria-current',k===i))};
    document.getElementById('tp').onclick=()=>{go(i-1);rst()};document.getElementById('tn').onclick=()=>{go(i+1);rst()};
    dots.forEach((d,k)=>d.onclick=()=>{go(k);rst()});
    const rst=()=>{clearInterval(timer);if(!matchMedia('(prefers-reduced-motion:reduce)').matches)timer=setInterval(()=>go(i+1),6500)};rst();
  }
  if(key==='fleet'){
    const chips=[...document.querySelectorAll('#chips .chip')],cards=[...document.querySelectorAll('.vcard')];
    chips.forEach(c=>c.onclick=()=>{chips.forEach(x=>x.setAttribute('aria-pressed',x===c));cards.forEach(v=>v.style.display=(c.dataset.f==='all'||v.dataset.v===c.dataset.f)?'':'none')});
  }
  [['cf','cok'],['qf','qok']].forEach(([f,o])=>{const form=document.getElementById(f);if(form)form.addEventListener('submit',e=>{e.preventDefault();document.getElementById(o).classList.add('show')})});
}
shell();
const wipe=document.createElement('div');wipe.className='wipe';wipe.innerHTML=logoMark();document.body.appendChild(wipe);
let busy=false;
addEventListener('hashchange',()=>{
  if(FX.reduce){route();return}
  if(busy)return;busy=true;wipe.classList.remove('go');void wipe.offsetWidth;wipe.classList.add('go');
  setTimeout(route,480);setTimeout(()=>{wipe.classList.remove('go');busy=false},1000);
});
route();fxGlobal();
</script>
